<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unity Dashboard · The Palm Group</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F6F3EE" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Unity Sales" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css?v=28" />
  <style>
    body { padding-bottom: 0; }
    .shell { max-width: 1240px; margin: 0 auto; padding: 18px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { font: 500 14px var(--sans); border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap; color: var(--ink); }
    .tabs button.on { background: var(--green); color: #fff; border-color: var(--green); }
    .tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: #B3261E; color: #fff; font-size: 11px; line-height: 18px; }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin: 16px 0; flex-wrap: wrap; }
    .toolbar .left { display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { width: auto; padding: 8px 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .stat b { display: block; font-size: 24px; font-family: var(--serif); }
    .stat-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
    .stat-btn:hover { border-color: #b9b3a8; }
    .stat-btn.on { background: var(--green, #2F4A3A); border-color: var(--green, #2F4A3A); color: #fff; }
    .stat-btn.on span { color: rgba(255,255,255,.8); }
    table.list { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .list th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 12px; background: #FBF9F5; border-bottom: 1px solid var(--line); }
    .list td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
    .list tr.row { cursor: pointer; }
    .list tr.row:hover { background: #FBF9F5; }
    .pri { display: inline-block; min-width: 30px; text-align: center; font-weight: 600; font-size: 12px; padding: 3px 8px; border-radius: 99px; }
    .P0 { background: #B3261E; color: #fff; } .P1 { background: #E8833A; color: #fff; } .P2 { background: #F2D48A; } .P3 { background: #E4E8E2; } .P4 { background: #F1F1EF; color: #888; }
    .bar { height: 6px; background: var(--line); border-radius: 9px; width: 70px; display: inline-block; vertical-align: middle; margin-left: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--green); }
    .tag { font-size: 11px; background: var(--sand-soft); color: #7A5B23; padding: 2px 8px; border-radius: 99px; margin: 0 4px 2px 0; white-space: nowrap; display: inline-block; }
    .tag-share { background: #DCE8DE; color: #2F4A3A; }
    .tag-via { background: #EEE; color: #555; }
    .tag-cp { background: #E8E2F4; color: #4B3B78; }
    .tag-red { background: #F8DCDA; color: #9B1C14; }
    .tag-ok { background: #DDEBD8; color: #2F5A22; }
    .role { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; }
    .role.super_admin { background: var(--green); color: #fff; } .role.sales { background: #DCE8DE; color: var(--green); } .role.channel_partner { background: #E8E2F4; color: #4B3B78; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--bg); z-index: 60; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,.15); padding: 20px; }
    .drawer h2 { margin-bottom: 0; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; margin: 14px 0; }
    .kv span { color: var(--muted); }
    .box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .box h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--sand); display: flex; justify-content: space-between; align-items: center; }
    .opening { background: var(--sand-soft); border-color: transparent; font-size: 15px; }
    .dwell-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 4px 0; }
    .dwell-row span:first-child { width: 110px; color: var(--muted); }
    .dwell-row .bar { width: auto; flex: 1; }
    .tl { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 10px; }
    .tl span:last-child { color: var(--muted); white-space: nowrap; }
    .tl.staff span:first-child { color: var(--green); }
    .msg { max-width: 92%; }
    .chatbox { display: flex; flex-direction: column; gap: 8px; }
    .login { max-width: 400px; margin: 60px auto; }
    .login form { display: grid; gap: 12px; margin-top: 14px; }
    .linkbox { display: flex; gap: 8px; align-items: center; }
    .linkbox input { font-size: 12px; }
    a.lnk, .lnk { color: var(--green); font-weight: 600; cursor: pointer; text-decoration: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form { display: grid; gap: 10px; }
    .form label { font-size: 12px; }
    .form input, .form select, .form textarea { padding: 9px 12px; }
    .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
    /* follow-ups */
    .fu-group h3 { font-family: var(--sans); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 22px 0 8px; display: flex; gap: 8px; align-items: center; }
    .fu-group h3 .n { background: var(--line); color: var(--ink); border-radius: 99px; padding: 1px 8px; font-size: 11px; letter-spacing: 0; }
    .fu-group.overdue h3 { color: #9B1C14; } .fu-group.overdue h3 .n { background: #F8DCDA; color: #9B1C14; }
    .fu { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; }
    .fu.late { border-left: 4px solid #B3261E; }
    .fu-ic { width: 38px; height: 38px; border-radius: 50%; background: var(--sand-soft); color: var(--green); display: grid; place-items: center; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .fu-main b { font-size: 14.5px; }
    .fu-main .small { display: block; margin-top: 2px; }
    .fu-note { font-size: 13.5px; margin-top: 4px; color: #3E4640; }
    .fu-out { font-size: 13px; margin-top: 4px; color: var(--green); }
    .fu-when { font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; }
    .fu-when.late { color: #B3261E; font-weight: 600; }
    .fu-actions { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
    .fu-done-form { grid-column: 1 / -1; background: #FBF9F5; border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
    .btn.xs { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
    .feed .tl b { font-weight: 600; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 99px; z-index: 99; font-size: 14px; }
    @media (max-width: 720px) { .hide-m { display: none; } .grid2 { grid-template-columns: 1fr; } .fu { grid-template-columns: 34px 1fr; } .fu-when { grid-column: 2; text-align: left; } }
  .btn.danger{background:#B3261E;color:#fff;border-color:#B3261E}.btn.danger:disabled{opacity:.45}.box.danger{border-color:#F0C9C5}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.install-sheet{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.install-sheet h3{margin:0 0 8px;font-family:var(--serif);font-size:26px}
.install-sheet ol{margin:8px 0 14px;padding-left:20px}.install-sheet li{margin:6px 0}
.install-sheet .app-ic{width:56px;height:56px;border-radius:14px;float:right;margin-left:12px}
.kn h2{font-family:var(--serif);font-size:24px;margin:22px 0 6px}.kn h3{font-size:16px;margin:16px 0 4px}.kn ul{margin:0 0 6px;padding-left:20px}.kn li{margin:4px 0;font-size:14px;overflow-wrap:anywhere}.kn p{font-size:14px;margin:6px 0}
@media (display-mode: standalone){#installBtn{display:none!important}}

/* ---- shared bits ---- */
.kn pre{background:#F4F1EB;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;overflow-x:auto;white-space:pre}
.internal-note{background:#FBF4E8;border-color:#EAD9B8}
a.btn{text-decoration:none}
.brand{display:flex;align-items:center;gap:10px}.brand-ic{width:22px;height:22px}
.stat b{font-family:var(--sans);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{text-transform:none;letter-spacing:0;font-size:12px}
.t-short,.m-only,.avatar,.more-btn{display:none}
.tab-ic{display:none}
#who{position:relative}
.acct{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;min-width:210px;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:40;text-align:left}
.acct .role{justify-self:start}
.more-item{display:block;width:100%;text-align:left;font:500 16px var(--sans);padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink)}
/* ---- phone layout ---- */
@media (max-width:720px){
  .t-full,.who-full{display:none}.t-short{display:inline}.m-only{display:block}
  .topbar{padding:10px 14px}
  .brand{font-size:12px;letter-spacing:.18em}
  .avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:#fff;font:600 15px var(--sans)}
  #installBtn{padding:6px 10px}
  .shell{padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
  /* bottom navigation */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;overflow:visible}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:12px;padding:6px 2px;font-size:11.5px;color:var(--muted);position:relative}
  .tabs button.extra{display:none}
  .tabs .more-btn{display:flex}
  .tabs .tab-ic{display:block;line-height:0}
  .tabs button.on{background:none;color:var(--green);font-weight:600}
  .tabs button.on .tab-ic{background:#DCE8DE;border-radius:99px;padding:2px 14px}
  .tabs .count{position:absolute;top:2px;left:calc(50% + 8px);margin:0}
  /* toolbar: search full width, filters in one swipeable row */
  .toolbar{margin:10px 0 12px;gap:8px;flex-wrap:nowrap;align-items:flex-start}
  .toolbar .left{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .toolbar .left::-webkit-scrollbar{display:none}
  .toolbar .left select{flex:none;font-size:14px;padding:8px 30px 8px 12px}
  #view>.toolbar:has(#q){display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
  #view>.toolbar:has(#q) .left,#view>.toolbar:has(#q) .tb-actions{display:contents}
  #view>.toolbar:has(#q) #q{grid-column:1/3;grid-row:1}
  #view>.toolbar:has(#q) #exportCsv{grid-column:3;grid-row:1}
  #view>.toolbar:has(#q) #refresh{display:none}
  #view>.toolbar:has(#q) #fScope{grid-column:1/-1}
  #view>.toolbar:has(#q) #fStatus{grid-column:2/-1}
  .toolbar .left select,.toolbar .left input{width:100%}
  /* stats: compact 3 across */
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .stat{padding:9px 10px;border-radius:10px}
  .stat span{font-size:11px;line-height:1.25;display:block;min-height:2.5em}
  .stat b{font-size:20px;line-height:1.2}
  /* lists become cards */
  table.list{border:0;background:none}
  .list thead{display:none}
  .list tr.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .list tr.row td{padding:0;border:0}
  .list tr.row td.hide-m{display:none}
  .list .bar{display:none}
  .m-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .m-meta .od{color:#B3261E;font-weight:500}
  .m-meta .tag{margin:0}
  .drawer{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .kv{grid-template-columns:110px 1fr}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
  <header class="topbar"><span class="brand"><img src="icons/favicon-32.png" alt="" class="brand-ic"><span>THE PALM <b>UNITY</b><span class="t-full"> · DASHBOARD</span></span></span><span class="top-right"><button class="btn ghost xs hidden" id="installBtn" aria-label="Install app"><span class="t-full">Install app</span><span class="t-short">Get app</span></button><span id="who" class="small"></span></span></header>

  <div class="login card" id="loginView">
    <h2>Sign in</h2>
    <p class="muted">For The Palm Group team. We'll send a code to your WhatsApp.</p>
    <form id="phoneForm">
      <label>Mobile number
        <div class="phone"><span>+91</span><input name="phone" inputmode="numeric" autocomplete="tel-national" placeholder="98765 43210" maxlength="14" /></div>
      </label>
      <p class="error" id="phoneError"></p>
      <button class="btn primary">Send code on WhatsApp</button>
    </form>
    <form id="codeForm" class="hidden">
      <p class="muted" id="codeSent"></p>
      <input class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" />
      <p class="dev-note hidden" id="devNote"></p>
      <p class="error" id="codeError"></p>
      <button class="btn primary">Sign in</button>
      <p class="small"><a href="#" id="changePhone">Use a different number</a></p>
    </form>
  </div>

  <div class="shell hidden" id="appView">
    <div class="tabs" id="mainTabs"></div>
    <section id="view"></section>
  </div>

  <div class="drawer hidden" id="drawer"></div>
  <div class="scrim hidden" id="scrim"></div>

  <script src="../config.js?v=28"></script>
  <script src="admin.js?v=31"></script>
</body>
</html>
