name = "palm-unity-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Lets the Worker import knowledge.md as text and unity.json as data
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "palm-unity-leads"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# Where the project page is hosted (used for salesperson share links)
SITE_URL = "https://experiencethepalm.github.io/LMS/"
# Comma-separated origins allowed to call this API (your GitHub Pages origin + local testing)
ALLOWED_ORIGINS = "https://experiencethepalm.github.io,http://localhost:8080"
# dev | wati | whatsapp | msg91   — keep "dev" until the Wati OTP template is approved
OTP_PROVIDER = "wati"
WATI_TEMPLATE_NAME = "unity_otp"
WATI_OTP_PARAM = "1"
WA_TEMPLATE_NAME = "unity_otp"
WA_TEMPLATE_LANG = "en"
AI_MODEL = "claude-haiku-5-5"

# Secrets — set with `npx wrangler secret put NAME` (never commit them):
#   TOKEN_SECRET        long random string (signs logins)
#   ADMIN_PASSWORD      owner dashboard password
#   ANTHROPIC_API_KEY   for the AI assistant
#   WATI_ACCESS_TOKEN (Wati v3 API key)     if OTP_PROVIDER = "wati"
#   WA_ACCESS_TOKEN, WA_PHONE_NUMBER_ID      if OTP_PROVIDER = "whatsapp"
#   MSG91_AUTH_KEY, MSG91_TEMPLATE_ID        if OTP_PROVIDER = "msg91"
#   ALERT_WEBHOOK_URL   optional: Google Chat/Slack webhook for visit & callback alerts
