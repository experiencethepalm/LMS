name: Deploy API to Cloudflare
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Create the D1 database on first run and wire its ID
        run: |
          get_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="palm-unity-leads");process.stdout.write(d?d.uuid:"")'; }
          ID=$(get_id)
          if [ -z "$ID" ]; then npx wrangler d1 create palm-unity-leads --location apac; ID=$(get_id); fi
          echo "Database ID: $ID"
          sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/$ID/" wrangler.toml

      - name: Apply database schema (safe to repeat)
        run: npx wrangler d1 execute palm-unity-leads --remote --file=schema.sql

      - name: Database migrations (safe to repeat)
        run: |
          npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE salespeople ADD COLUMN share_id TEXT" || echo "share_id already exists"
          npx wrangler d1 execute palm-unity-leads --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_sales_share ON salespeople(share_id)"
          npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE leads ADD COLUMN referred_by INTEGER" || echo "referred_by already exists"
          npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE leads ADD COLUMN share_id TEXT" || echo "lead share_id already exists"
          npx wrangler d1 execute palm-unity-leads --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_leads_share ON leads(share_id)"
          npx wrangler d1 execute palm-unity-leads --remote --command "CREATE INDEX IF NOT EXISTS idx_leads_ref ON leads(referred_by)"
          for col in "role TEXT DEFAULT 'sales'" "company TEXT" "created_by TEXT" "last_login INTEGER"; do
            npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE salespeople ADD COLUMN $col" || echo "salespeople.$col exists"
          done
          npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE leads ADD COLUMN assigned_to TEXT" || echo "leads.assigned_to exists"
          npx wrangler d1 execute palm-unity-leads --remote --command "ALTER TABLE otps ADD COLUMN purpose TEXT DEFAULT 'buyer'" || echo "otps.purpose exists"
          npx wrangler d1 execute palm-unity-leads --remote --command "UPDATE salespeople SET role='sales' WHERE role IS NULL"
          npx wrangler d1 execute palm-unity-leads --remote --command "UPDATE leads SET assigned_to=first_ref WHERE assigned_to IS NULL AND first_ref IN (SELECT code FROM salespeople WHERE COALESCE(role,'sales') IN ('sales','super_admin'))"
          npx wrangler d1 execute palm-unity-leads --remote --command "CREATE INDEX IF NOT EXISTS idx_leads_assigned ON leads(assigned_to)"

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set Worker secrets from GitHub secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPER_ADMIN_PHONE: ${{ secrets.SUPER_ADMIN_PHONE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATI_API_ENDPOINT: ${{ secrets.WATI_API_ENDPOINT }}
          WATI_ACCESS_TOKEN: ${{ secrets.WATI_ACCESS_TOKEN }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          EXISTING=$(npx wrangler secret list --format json 2>/dev/null || echo '[]')
          node -e '
            const crypto = require("crypto");
            const existing = JSON.parse(process.argv[1]).map((s) => s.name);
            const out = {};
            for (const k of ["ADMIN_PASSWORD","SUPER_ADMIN_PHONE","ANTHROPIC_API_KEY","WATI_API_ENDPOINT","WATI_ACCESS_TOKEN","WA_ACCESS_TOKEN","WA_PHONE_NUMBER_ID","MSG91_AUTH_KEY","MSG91_TEMPLATE_ID","ALERT_WEBHOOK_URL"])
              if (process.env[k]) out[k] = process.env[k];
            // Signing key is generated once and kept, so buyer and staff logins survive redeploys
            if (!existing.includes("TOKEN_SECRET")) out.TOKEN_SECRET = crypto.randomBytes(32).toString("hex");
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("Setting:", Object.keys(out).join(", ") || "(nothing new)");
          ' "$EXISTING"
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json
